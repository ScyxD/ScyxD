<svg xmlns="http://www.w3.org/2000/svg" width="430" height="200" viewBox="0 0 430 200" role="img"><title>AnonXMusic</title>
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f5ff"/><stop offset="1" stop-color="#00f5ff" stop-opacity="0"/></linearGradient>
<linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121923"/><stop offset="1" stop-color="#0e131b"/></linearGradient>
<filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="cp"><rect width="430" height="200" rx="16"/></clipPath></defs>
<style>
.ar{animation:nd 2.4s ease-in-out infinite}
@keyframes nd{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
</style>

<g clip-path="url(#cp)">
<rect width="430" height="200" fill="url(#cb)"/>
<circle cx="400" cy="10" r="80" fill="#00f5ff" opacity=".16" filter="url(#bl)"/>
<rect width="430" height="3" fill="url(#tb)"/>
<rect x="24" y="24" width="46" height="46" rx="13" fill="#00f5ff" fill-opacity=".12" stroke="#00f5ff" stroke-opacity=".45"/>
<g transform="translate(36 36) scale(0.917)" fill="none" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g>
<text x="84" y="44" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#e6edf3">AnonXMusic</text>
<text x="84" y="63" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="1.6" fill="#00f5ff">TELEGRAM BOT</text>
<g class="ar"><g transform="translate(384 26) scale(0.833)" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></g></g>
<text x="24" y="108" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9da7b3">Voice-chat music bot with multi-source playback,</text>
