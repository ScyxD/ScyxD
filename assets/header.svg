.pl{transform-box:fill-box;transform-origin:center;animation:pls 3s ease-in-out infinite}
@keyframes pls{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.7)}}
.fl{animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,14px)}}
</style>

