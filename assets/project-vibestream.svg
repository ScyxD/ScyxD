<svg xmlns="http://www.w3.org/2000/svg" width="430" height="200" viewBox="0 0 430 200" role="img"><title>VibeStream API</title>
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
<linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121923"/><stop offset="1" stop-color="#0e131b"/></linearGradient>
<filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="cp"><rect width="430" height="200" rx="16"/></clipPath></defs>
<style>
.ar{animation:nd 2.4s ease-in-out infinite}
@keyframes nd{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
</style>

<g clip-path="url(#cp)">
<rect width="430" height="200" fill="url(#cb)"/>
<circle cx="400" cy="10" r="80" fill="#a855f7" opacity=".16" filter="url(#bl)"/>
<rect width="430" height="3" fill="url(#tb)"/>
<rect x="24" y="24" width="46" height="46" rx="13" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".45"/>
<g transform="translate(36 36) scale(0.917)" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></g>
<text x="84" y="44" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#e6edf3">VibeStream API</text>
<text x="84" y="63" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="1.6" fill="#a855f7">STREAMING API</text>
<g class="ar"><g transform="translate(384 26) scale(0.833)" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></g></g>
<text x="24" y="108" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9da7b3">YouTube streaming API with Telegram caching,</text>
<text x="24" y="130" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9da7b3">Google OAuth, tiered plans and admin dashboard.</text><rect x="24" y="152" width="72" height="26" rx="13" fill="#a855f7" fill-opacity=".1" stroke="#a855f7" stroke-opacity=".4"/><text x="35" y="169" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#e6edf3">FastAPI</text><rect x="104" y="152" width="80" height="26" rx="13" fill="#a855f7" fill-opacity=".1" stroke="#a855f7" stroke-opacity=".4"/><text x="115" y="169" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#e6edf3">Pyrogram</text><rect x="192" y="152" width="65" height="26" rx="13" fill="#a855f7" fill-opacity=".1" stroke="#a855f7" stroke-opacity=".4"/><text x="203" y="169" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#e6edf3">yt-dlp</text></g><rect x=".5" y=".5" width="429" height="199" rx="16" fill="none" stroke="#242b36"/>
</svg>
